<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark glassmorphic background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="100%" stop-color="#0f0f12" />
    </linearGradient>
    
    <!-- Sunset gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#eb5e28" />
      <stop offset="100%" stop-color="#fbc531" />
    </linearGradient>
    
    <!-- Mountain gradient -->
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70a1ff" />
      <stop offset="100%" stop-color="#482ff7" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#eb5e28" stroke-width="6" />

  <!-- Sunset Sun -->
  <circle cx="256" cy="230" r="100" fill="url(#sunGrad)" opacity="0.9" />

  <!-- Back mountain range -->
  <polygon points="120,400 240,240 330,400" fill="#2d3436" opacity="0.6" />

  <!-- Front Majestic Mountain -->
  <polygon points="180,400 320,200 440,400" fill="url(#mountainGrad)" />

  <!-- Stylized Reflection Lines -->
  <line x1="160" y1="430" x2="352" y2="430" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.3" />
  <line x1="200" y1="450" x2="312" y2="450" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.2" />
</svg>
